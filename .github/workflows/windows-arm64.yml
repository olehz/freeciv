name: Windows ARM64

on:
  push:
    branches: [windows-arm64]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-arm64
  cancel-in-progress: true

jobs:
  qt6:
    name: qt6 ARM64
    runs-on: windows-11-arm
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            gettext
            python
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-qt6-base
            mingw-w64-clang-aarch64-qt6-svg
            mingw-w64-clang-aarch64-icu
            mingw-w64-clang-aarch64-curl
            mingw-w64-clang-aarch64-sdl3-mixer
            mingw-w64-clang-aarch64-sqlite3
            mingw-w64-clang-aarch64-python
            mingw-w64-clang-aarch64-tolua

      - name: Configure and build
        run: |
          set -euo pipefail
          test -d /clangarm64
          meson setup build \
            --prefix="$PWD/dist" \
            -Dbuildtype=release \
            -Dclients=qt \
            -Dfcmp=qt \
            -Dqtver=qt6 \
            -Dsvgflags=true \
            -Dtools=manual,ruleup \
            -Dreadline=false \
            -Dsyslua=false \
            -Dsys-tolua-cmd=true \
            -Dmwand=false \
            -Daudio=sdl3 \
            -Dfollowtag=windows-S3_4 \
            -Dgitrev=true \
            -Dcacert-path=./ssl/certs/ca-bundle.crt
          meson compile -C build
          meson install -C build

      - name: Bundle runtime
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PREFIX="$PWD/dist"
          mkdir -p "$PREFIX/plugins" "$PREFIX/ssl/certs"
          cp -a /clangarm64/share/qt6/plugins/. "$PREFIX/plugins/"
          cp -f /clangarm64/etc/ssl/certs/ca-bundle.crt "$PREFIX/ssl/certs/"
          printf '[Paths]\nPlugins = plugins\n' > "$PREFIX/bin/qt.conf"
          cp -f "$ROOT/platforms/windows/installer_msys2/freeciv-qt.cmd" "$PREFIX/bin/"
          cp -f "$ROOT/platforms/windows/installer_msys2/freeciv-mp-qt.cmd" "$PREFIX/bin/"
          cp -f "$ROOT/platforms/windows/installer_msys2/freeciv-server.cmd" "$PREFIX/bin/"
          cd "$PREFIX/bin"
          pending=$(find . -maxdepth 1 -type f -name '*.exe' -printf '%f ')
          find "$PREFIX/plugins" -type f -name '*.dll' -printf '%p ' >> /tmp/qt-plugins.txt || true
          while [ -n "${pending// /}" ]; do
            next=""
            for bin in $pending; do
              deps=$(ldd "$bin" | sed -n 's/.*=> \/clangarm64\/bin\/\([^ ]*\).*/\1/p' || true)
              for dep in $deps; do
                if [ ! -e "$dep" ]; then
                  cp -f "/clangarm64/bin/$dep" .
                  next="$next $dep"
                fi
              done
            done
            pending=$next
          done
          if [ -f /tmp/qt-plugins.txt ]; then
            for plug in $(cat /tmp/qt-plugins.txt); do
              deps=$(ldd "$plug" | sed -n 's/.*=> \/clangarm64\/bin\/\([^ ]*\).*/\1/p' || true)
              for dep in $deps; do
                if [ ! -e "$PREFIX/bin/$dep" ]; then
                  cp -f "/clangarm64/bin/$dep" "$PREFIX/bin/"
                fi
              done
            done
          fi
          mv "$PREFIX/bin/"* "$PREFIX/"
          rmdir "$PREFIX/bin"
          mv "$PREFIX/share/freeciv" "$PREFIX/data"

      - name: Verify ARM64 and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item dist\freeciv-qt.exe
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { throw ("freeciv-qt.exe is not ARM64 (0x{0:X4})" -f $machine) }
          if (-not (Test-Path dist\plugins\platforms\qwindows.dll)) { throw "Qt Windows platform plugin is missing" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          & 7z.exe a -bb1 -tzip package\Freeciv-winarm64-qt6.zip .\dist\*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Freeciv-winarm64-qt6
          path: package/Freeciv-winarm64-qt6.zip
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $notes = @"
          Unofficial native Windows ARM64 build of Freeciv ${{ github.sha }}.

          Qt 6 client, which uses the Windows style. Launch freeciv-qt.cmd.
          "@
          $zip = "package/Freeciv-winarm64-qt6.zip"
          $tag = "windows-arm64"
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target windows-arm64 --title "Windows ARM64 Qt 6" --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
